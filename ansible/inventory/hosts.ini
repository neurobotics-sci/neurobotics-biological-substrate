##########################################################
# TL-SG116E Switch Ports and IP Address Node Allocation: #
##########################################################

# Switch Port 1  - 192.168.30.101 - Jetson Nano 2GB - visual ( visual-l, visual-r, occipital_lobe )
# Switch Port 2  - 192.168.30.102 - Jetson Nano 2GB - cerebellum/basal-ganglia/somatosensory
# Switch Port 3  - 192.168.30.103 - Jetson Nano 2GB - speech/hearing nuclei / STT
# Switch Port 12 - 192.168.10.112 - N150 Core (16GB Master Node) - SBALF Tiers 6 and 7
# Switch Port 15 - 192.168.30.115 - Jetson Nano 2GB - Limbic / Homeostatic / Autonomic
# Switch Port 16 - 192.168.30.116 - Jetson Nano 2GB - Thalamus L/R
# Switch Port 5  - 192.168.10.1   - ZOTAC Gateway Node (Hosts LLMs on 8080/8081)

########################################################################
# Brain Region to ansible_host to Ansible role to TCP/IP port mappings #
########################################################################

#   Tier Mapping Legend

# OSS+AGPL3.0 released tiers:
#----------------------------
# T1 - sensing
# T2 - homeostasis
# T3 - limbic
# T4 - multimodal
# T5 - motor execution

# Proprietary Held IP tiers:
#---------------------------
# T6 - sequential planning
# T7 - executive


[homeostatic]
hypothalamus    ansible_host=192.168.10.112  brain_role=hypothalamus   brain_port=5602 # T2
insula          ansible_host=192.168.10.112  brain_role=insula         brain_port=5605 # T2

[thalamus]
thalamus-l      ansible_host=192.168.10.112  brain_role=thalamus_l     brain_port=5603 # T2
thalamus-r      ansible_host=192.168.10.112  brain_role=thalamus_r     brain_port=5608 # T2
dist-thalami    ansible_host=192.168.10.112  brain_role=dist-thalami   brain_port=5646 # T2

[brainstem]
reticular       ansible_host=192.168.10.112  brain_role=reticular      brain_port=5650 # T1

[limbic]
hippocampus     ansible_host=192.168.10.112  brain_role=hippocampus    brain_port=5620 # T3
amygdala        ansible_host=192.168.10.112  brain_role=amygdala       brain_port=5621 # T3

[motor]
somatosensory   ansible_host=192.168.10.112  brain_role=somatosensory  brain_port=5632 # T4
m1              ansible_host=192.168.10.112  brain_role=m1             brain_port=5645 # T5
cerebellum      ansible_host=192.168.10.112  brain_role=cerebellum     brain_port=5640 # T5
basal-ganglia   ansible_host=192.168.10.112  brain_role=basal_ganglia  brain_port=5641 # T5

[cortical]
cingulate       ansible_host=192.168.10.112  brain_role=cingulate      brain_port=5648 # T4

[system_cores_x86]
circadian_clock  ansible_host=192.168.10.112  brain_role=circadian      brain_port=5652 # T3
dopaminergic_sys ansible_host=192.168.10.112  brain_role=dopamine       brain_port=5653 # T3
ans_autonomic    ansible_host=192.168.10.112  brain_role=autonomic      brain_port=5654 # T2
vagus_nerve      ansible_host=192.168.10.112  brain_role=vagus          brain_port=5657 # T2

########################################################################
# Hardware Architecture Supersets & Python Interpreter Mappings        #
########################################################################

[all:vars]
ansible_user=brain
# If the target is the  neocortex, use .local. Otherwise, use the standard path.
brain_home="{{ '/opt/brain' }}"
brain_venv="{{ brain_home }}/venv"
brain_version="16.0.0" # Matches Bubo Mark XVI Chassis

# 1. The Jetson ARM64 Superset (VLAN 30)
[jetson_nano:children]

[thalamus:vars]
ansible_python_interpreter=/opt/brain/venv/bin/python

[sbud:children]
# Obviously this is an incomplete list

[jetson_nano:vars]
ansible_python_interpreter=/home/brain/miniforge3/bin/python3

# 2. The x86 Superset (VLAN 10)
[x86_core:children]
limbic
motor
cortical
system_cores_x86
homeostatic
thalamus
brainstem

[x86_core:vars]
ansible_python_interpreter=/usr/bin/python3

# 3. Brain superset
[bubo_brain:children]
jetson_nano
x86_core
#spinal

